name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # DESIGN.md §9: "version in pyproject.toml authoritative, tag-checked".
      # The tag was never actually checked, so a release tagged v1.0.0 cut
      # from a tree that still said 0.2.0 would have published 0.2.0 under
      # that tag — silently, and unfixably, since PyPI will not let a
      # version be re-uploaded. Fail here instead, before anything is built.
      - name: Tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${version}'"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${version}"

      # src/aida/__init__.py carries the version the running program
      # reports (`aida --version`, `aida doctor`, the About box, and the
      # workflow run manifest). Nothing derives one from the other, so
      # they drift silently; a release is the one moment that must not
      # ship with them disagreeing.
      - name: pyproject version must match aida.__version__
        run: |
          python - <<'EOF'
          import pathlib, re, tomllib
          meta = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/aida/__init__.py").read_text()
          found = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if meta != found:
              raise SystemExit(
                  f"::error::pyproject.toml says {meta} but src/aida/__init__.py says {found}"
              )
          print(f"both say {meta}")
          EOF

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/aida-workbench

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1