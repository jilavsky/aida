# Example ~/.aida/providers.yaml — commented, illustrative only.
# NO secret values ever belong in this file — only `secret_ref` names that
# point at entries in the OS keychain (or an AIDA_SECRET_<PROFILE> env var).
# See PLAN.md §4 "Configuration layout" and aida.config.secrets.

config_version: 1

profiles:
  # A local model served through an OpenAI-compatible endpoint
  # (Ollama, LM Studio, Unsloth Desktop, llama.cpp server, ...).
  ollama-qwen:
    kind: openai_compat
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:14b"
    secret_ref: null            # local endpoints often need no key
    capability_notes: "small local model — prefer lean MCP groups"

  # Anthropic Claude via the ANL Argo proxy (as used by BeamlineAdvisor).
  argo-claude:
    kind: anthropic
    base_url: "https://apps.inside.anl.gov/argoapi/"
    model: "claude-sonnet"
    secret_ref: "argo-claude"   # `aida config secret set argo-claude <ANL username>`
    capability_notes: "cloud model via institutional proxy"

  # Anthropic Claude direct.
  claude-direct:
    kind: anthropic
    base_url: null               # SDK default
    model: "claude-sonnet"
    secret_ref: "claude-direct"  # `aida config secret set claude-direct <api key>`
    capability_notes: ""

# Embedding profiles (Phase 8, RAG knowledge bases) — a separate list from
# `profiles:` above because an embedding model isn't a chat model: it turns
# text into vectors, it's what a knowledge base's `embedding_profile:` field
# (in knowledge.yaml) points at, and re-querying an index with a *different*
# embedding_profiles entry than the one that built it is refused (different
# models' vector spaces aren't comparable). Only `kind: openai_compat` exists
# today — it covers Ollama, LM Studio, OpenAI, and Argo's cloud embeddings
# proxy alike, same as `profiles:` above for chat. There is no "anthropic"
# embeddings kind: Anthropic has no first-party embeddings API.
embedding_profiles:
  # A local embedding model served through Ollama's OpenAI-compatible
  # endpoint. Pull it once with `ollama pull nomic-embed-text`.
  ollama-embed:
    kind: openai_compat
    base_url: "http://localhost:11434/v1"
    model: "nomic-embed-text"
    secret_ref: null            # local endpoints often need no key
    capability_notes: "local embeddings — no data leaves the machine"

  # OpenAI's own embeddings endpoint via the ANL Argo proxy (BeamlineAdvisor
  # precedent: text-embedding-3-small via proxy).
  argo-embed:
    kind: openai_compat
    base_url: "https://apps.inside.anl.gov/argoapi/v1"
    model: "text-embedding-3-small"
    secret_ref: "argo-embed"    # `aida config secret set argo-embed <ANL username>`
    capability_notes: "cloud embeddings via institutional proxy"
