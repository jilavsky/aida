# Example ~/.aida/workspaces.yaml — commented, illustrative only.
# A workspace bundles: provider profile, source/target folders, MCP group,
# skills, system prompt, and safety mode. See PLAN.md §4 "Workspaces".

config_version: 1

workspaces:
  use-pyirena:
    profile: argo-claude
    source_folders:
      - "/Volumes/data/USAXS_2026_08"
    target_folder: "~/Documents/Aida/analysis"
    sidecar_folder_name: "figures"    # Obsidian-style attachments folder
    mcp_group: pyirena-analysis
    skills:
      - saxs-basics
      - pyirena-usage
    system_prompt: "prompts/pyirena.md"
    safety: relaxed                    # folders are backed up; see PLAN.md §5

  perform-reviews:
    profile: argo-claude
    source_folders:
      - "~/Documents/reviews/incoming"
    target_folder: "~/Documents/reviews/out"
    sidecar_folder_name: "figures"
    mcp_group: none
    skills:
      - review-checklist
    system_prompt: null
    safety: confirm

  # Shared-beamline examples: the workspace selects capabilities; the
  # toolbar's user label supplies the per-person {user} path segment.
  usaxs-user:
    profile: argo-claude
    source_folders:
      - "/share1/USAXS_data"
    target_folder: "~/Documents/Aida/usaxs-user"
    saved_scripts_dir: "~/Documents/Aida/usaxs-user/saved_scripts/{user}"
    mcp_group: pyirena-analysis
    skills:
      - saxs-basics
      - pyirena-usage
    system_prompt: "prompts/usaxs-user.md"
    safety: confirm

  usaxs-staff:
    profile: argo-claude
    source_folders:
      - "/share1/USAXS_data"
    target_folder: "~/Documents/Aida/usaxs-staff"
    saved_scripts_dir: "~/Documents/Aida/usaxs-staff/saved_scripts/{user}"
    python_interpreter: "~/miniconda3/envs/aievaluator/bin/python"
    scripting_enabled: true
    mcp_group: pyirena-analysis
    skills:
      - saxs-basics
      - pyirena-usage
    system_prompt: "prompts/usaxs-staff.md"
    safety: relaxed
