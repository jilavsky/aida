<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8a94a6"/></marker></defs>
<rect width="1600" height="840" fill="#ffffff"/>
<text x="56.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">If you are coming from Claude Desktop or ChatGPT</text>
<text x="56.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Most of AIDA is a word you already know. Two rows have no equivalent at all — and those two are the point.</text>
<rect x="56.0" y="128.0" width="1488.0" height="44.0" rx="10" fill="#1c2333"/>
<text x="80.0" y="157.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="start">YOU KNOW IT AS</text>
<text x="460.0" y="157.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="start">IN AIDA IT IS</text>
<text x="860.0" y="157.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="start">THE DIFFERENCE THAT MATTERS</text>
<rect x="56.0" y="182.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">The app is the model</text>
<text x="460.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">Profile</text>
<text x="860.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">You choose the model and the endpoint; several profiles can share one endpoint.</text>
<rect x="56.0" y="256.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Custom instructions</text>
<text x="460.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">System prompt</text>
<text x="860.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Per workspace, not one global setting.</text>
<rect x="56.0" y="330.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="370.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">A "GPT" or a Project</text>
<text x="460.0" y="370.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">Workspace</text>
<text x="860.0" y="370.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Also carries folders, safety rules, and an interpreter.</text>
<rect x="56.0" y="404.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="444.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Uploaded project files</text>
<text x="460.0" y="444.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">Knowledge base  or  source folder</text>
<text x="860.0" y="444.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Two different things: searched by meaning vs. opened by name.</text>
<rect x="56.0" y="478.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="518.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Connectors / extensions</text>
<text x="460.0" y="518.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">MCP servers</text>
<text x="860.0" y="518.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">Same protocol — a claude_desktop_config.json imports directly.</text>
<rect x="56.0" y="552.0" width="1488.0" height="66.0" rx="10" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.2"/>
<text x="80.0" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">"Allow this action?" popups</text>
<text x="460.0" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2333" text-anchor="start">Safety mode</text>
<text x="860.0" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">You decide how often it asks, per workspace.</text>
<rect x="56.0" y="626.0" width="1488.0" height="66.0" rx="10" fill="#fdf4e7" stroke="#c07818" stroke-width="1.8"/>
<text x="80.0" y="666.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#8a94a6" text-anchor="start">— nothing like it —</text>
<text x="460.0" y="666.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#c07818" text-anchor="start">Source / target folders</text>
<text x="860.0" y="666.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">The agent reads and writes real files on your disk.</text>
<rect x="56.0" y="700.0" width="1488.0" height="66.0" rx="10" fill="#fdf4e7" stroke="#c07818" stroke-width="1.8"/>
<text x="80.0" y="740.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#8a94a6" text-anchor="start">— nothing like it —</text>
<text x="460.0" y="740.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#c07818" text-anchor="start">Python interpreter</text>
<text x="860.0" y="740.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal" font-style="normal" fill="#4a5568" text-anchor="start">The agent writes and runs code in your own conda environment.</text>
<rect x="56.0" y="780.0" width="1488.0" height="56.0" rx="10" fill="#f4f6f9"/>
<text x="80.0" y="814.0" font-family="Helvetica Neue, Helvetica, Arial, Carlito, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2333" text-anchor="start">Everything above the highlighted rows is convenience. The last two rows are why AIDA exists.</text>
</svg>
