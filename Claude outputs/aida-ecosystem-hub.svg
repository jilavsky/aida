<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aida ecosystem hub: Aida in the center, cloud (Argo: Claude, ChatGPT) or local (Ollama: Muse-Glimmer) models above, beamline data pipeline (instrument control, pyIrena analysis, Bernardyn plotting) on the left, and general-purpose MCP servers (search, documents, browser, Mac automation) on the right."><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><radialGradient id="hubfill" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ede9fe"/></radialGradient></defs><rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/><text x="960.0" y="58" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Aida at the Center of the Beamline AI Ecosystem</text><text x="960.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" font-style="normal" fill="#64748b" text-anchor="middle">One AI workbench — any model you choose — connected through MCP servers to the instrument, the analysis, and everything else</text><rect x="540" y="158" width="400" height="110" rx="16" fill="#f0f9ff" stroke="#0369a1" stroke-width="2.5"/><text x="740.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#0369a1" text-anchor="middle">Cloud — via ANL Argo</text><text x="740.0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Claude  ·  ChatGPT</text><text x="740.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="middle">strongest reasoning, for hard problems</text><line x1="740.0" y1="272.0" x2="862.4" y2="447.2" stroke="#0369a1" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ink)"/><rect x="980" y="158" width="400" height="110" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/><text x="1180.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#047857" text-anchor="middle">Local — via Ollama</text><text x="1180.0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Muse-Glimmer-30B  ·  others</text><text x="1180.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="middle">data never leaves the machine</text><line x1="1180.0" y1="272.0" x2="1057.6" y2="447.2" stroke="#047857" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ink)"/><text x="960" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#64748b" text-anchor="middle">THE BRAIN — your choice, switchable mid-conversation</text><text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#047857" text-anchor="start">AT THE BEAMLINE</text><text x="60" y="324" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">users flow data: instrument → pyIrena → Bernardyn</text><text x="1300" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#4338ca" text-anchor="start">EVERYTHING ELSE</text><text x="1300" y="324" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">the rest of a scientist's working day</text><rect x="60" y="345" width="560" height="165" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><rect x="60" y="359" width="7" height="137" rx="3.5" fill="#1d4ed8"/><circle cx="105" cy="381" r="16" fill="#1d4ed8"/><text x="105" y="387" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">1</text><text x="132" y="388" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Run the Instrument</text><text x="90" y="421" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#1d4ed8" text-anchor="start">bait_mcp → queue server → Bluesky (usaxs-bits)</text><text x="90" y="449" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Same safe plans the GUI and command line use.</text><text x="90" y="474" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Inspect: epics-mcp (PVs) · aievaluator (beam, flux, tunes)</text><rect x="60" y="572" width="560" height="165" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/><rect x="60" y="586" width="7" height="137" rx="3.5" fill="#047857"/><circle cx="105" cy="608" r="16" fill="#047857"/><text x="105" y="614" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">2</text><text x="132" y="615" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Analyze the Data</text><text x="90" y="648" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#047857" text-anchor="start">pyirena-mcp</text><text x="90" y="676" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Find, summarize, average, subtract, merge — then fit:</text><text x="90" y="701" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Unified Fit, size distribution, modeling → NXcanSAS</text><rect x="60" y="799" width="560" height="165" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><rect x="60" y="813" width="7" height="137" rx="3.5" fill="#c2410c"/><circle cx="105" cy="835" r="16" fill="#c2410c"/><text x="105" y="841" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">3</text><text x="132" y="842" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Plot the Data</text><text x="90" y="875" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#c2410c" text-anchor="start">bernardyn-mcp</text><text x="90" y="903" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Guinier, Kratky, Porod views, waterfalls,</text><text x="90" y="928" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">publication figures (PNG / SVG / Igor ITX)</text><line x1="130.0" y1="516.0" x2="130.0" y2="564.0" stroke="#047857" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-green)"/><text x="152" y="547.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#047857" text-anchor="start">Matilda reduces every scan automatically</text><line x1="130.0" y1="743.0" x2="130.0" y2="791.0" stroke="#047857" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-green)"/><text x="152" y="774.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#047857" text-anchor="start">calibrated data · fit results in NXcanSAS</text><rect x="1300" y="345" width="560" height="132" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/><rect x="1300" y="359" width="7" height="104" rx="3.5" fill="#4338ca"/><text x="1330" y="388" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Search</text><text x="1330" y="421" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#4338ca" text-anchor="start">brave · web-search · scientific-papers</text><text x="1330" y="449" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">literature and facts — looked up, not remembered</text><rect x="1300" y="507" width="560" height="132" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><rect x="1300" y="521" width="7" height="104" rx="3.5" fill="#0f766e"/><text x="1330" y="550" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Documents &amp; Notes</text><text x="1330" y="583" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#0f766e" text-anchor="start">Obsidian · MS Office (Word, Excel, PowerPoint)</text><text x="1330" y="611" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">read papers &amp; proposals, write reports and slides</text><rect x="1300" y="669" width="560" height="132" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="1300" y="683" width="7" height="104" rx="3.5" fill="#334155"/><text x="1330" y="712" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Web Browser</text><text x="1330" y="745" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#334155" text-anchor="start">Playwright</text><text x="1330" y="773" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">drive real web pages: portals, forms, databases</text><rect x="1300" y="831" width="560" height="132" rx="16" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.5"/><rect x="1300" y="845" width="7" height="104" rx="3.5" fill="#a21caf"/><text x="1330" y="874" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Mac Automation</text><text x="1330" y="907" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="italic" fill="#a21caf" text-anchor="start">applescript_execute · macos_automator</text><text x="1330" y="935" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Mail, Calendar, Finder — any app on the desktop</text><line x1="805.7" y1="516.3" x2="630.0" y2="427.5" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="805.7" cy="516.3" r="5" fill="#6d28d9"/><line x1="792.0" y1="621.9" x2="630.0" y2="654.5" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="792.0" cy="621.9" r="5" fill="#6d28d9"/><line x1="830.2" y1="701.3" x2="630.0" y2="881.5" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="830.2" cy="701.3" r="5" fill="#6d28d9"/><line x1="1111.3" y1="510.3" x2="1290.0" y2="411.0" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="1111.3" cy="510.3" r="5" fill="#6d28d9"/><line x1="1130.8" y1="581.5" x2="1290.0" y2="573.0" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="1130.8" cy="581.5" r="5" fill="#6d28d9"/><line x1="1117.3" y1="657.1" x2="1290.0" y2="735.0" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="1117.3" cy="657.1" r="5" fill="#6d28d9"/><line x1="1086.9" y1="704.6" x2="1290.0" y2="897.0" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><circle cx="1086.9" cy="704.6" r="5" fill="#6d28d9"/><circle cx="960" cy="590" r="179" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4 6"/><circle cx="960" cy="590" r="165" fill="url(#hubfill)" stroke="#6d28d9" stroke-width="5"/><text x="960" y="528" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" font-style="normal" fill="#5b21b6" text-anchor="middle">Aida</text><text x="960" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#6d28d9" text-anchor="middle">AI Data Assistant</text><text x="960" y="594" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">workspaces on your folders</text><text x="960" y="617" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">search of your own docs</text><text x="960" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">writes &amp; runs Python</text><text x="960" y="663" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">shows plots, reads figures</text><text x="960" y="686" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">asks before it writes</text><rect x="60" y="985" width="1800" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="1016" x2="150" y2="1016" stroke="#6d28d9" stroke-width="2.5"/><circle cx="90" cy="1016" r="5" fill="#6d28d9"/><text x="164" y="1022" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">= an MCP server.</text><text x="322" y="1022" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Add a server and Aida gains a skill — same conversation, same permissions, any model. Users and I share one tool; we just use different spokes.</text></svg>
