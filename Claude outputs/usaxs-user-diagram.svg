<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="1200" viewBox="0 0 1180 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified, user-facing diagram of the five steps to run and analyze USAXS/SAXS/WAXS experiments, showing the three interchangeable interfaces — command line, GUI, and AI agent — available at each interactive step." font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1180" height="1200" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="590.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Three Ways to Run USAXS, SAXS, and WAXS</text><text x="590.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#64748b" text-anchor="middle">Pick the interface that fits you — mix and match at every step of an experiment</text><rect x="60" y="96" width="1060" height="116" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="106" cy="121" r="13" fill="#047857"/><text x="106" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">1</text><text x="126" y="126" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Lay Out Your Samples</text><text x="94" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Click sample positions on a plate image, in Igor Pro — the everyday tool —</text><text x="94" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">or in Matilda's newer sample-plate app. Export a plan, or send it straight</text><text x="94" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">to the queue, ready for the next step.</text><line x1="590.0" y1="212" x2="590.0" y2="252" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-ink)"/><text x="604.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">your plan is ready</text><circle cx="72" cy="260" r="13" fill="#1e293b"/><text x="72" y="264.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">2</text><text x="92" y="266" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Run the Instrument</text><rect x="60.0" y="284" width="338.6666666666667" height="190" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><rect x="210.33333333333334" y="304" width="38" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.8"/><path d="M217.33333333333334,313 l7,5 l-7,5" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="230.33333333333334" y1="323" x2="240.33333333333334" y2="323" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><text x="229.33333333333334" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Command Line</text><text x="229.33333333333334" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#475569" text-anchor="middle">Interactive Bluesky/IPython</text><text x="229.33333333333334" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Type commands directly</text><text x="229.33333333333334" y="408.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">into a live session —</text><text x="229.33333333333334" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">full control, for experts</text><rect x="420.6666666666667" y="284" width="338.6666666666667" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><rect x="571.0" y="304" width="38" height="26" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><line x1="571.0" y1="311" x2="609.0" y2="311" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="576.0" cy="307.5" r="1.3" fill="#1d4ed8"/><circle cx="581.0" cy="307.5" r="1.3" fill="#1d4ed8"/><path d="M587.0,317 l11,10 l-4.2,0.8 l2.6,5 l-2.6,1.3 l-2.6,-5 l-3.2,3 z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.6" stroke-linejoin="round"/><text x="590.0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Desktop App (GUI)</text><text x="590.0" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#1d4ed8" text-anchor="middle">usaxs-qmonitor</text><text x="590.0" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Build a queue and watch it run,</text><text x="590.0" y="408.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">point and click — no typing,</text><text x="590.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">live tune plots included</text><rect x="781.3333333333334" y="284" width="338.6666666666667" height="190" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><rect x="931.6666666666667" y="303" width="32" height="22" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/><path d="M941.6666666666667,325 l0,9 l8,-9 z" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/><circle cx="944.6666666666667" cy="314" r="1.6" fill="#6d28d9"/><circle cx="951.6666666666667" cy="314" r="1.6" fill="#6d28d9"/><path d="M966.6666666666667,299 L968.2666666666668,303.4 L972.6666666666667,305 L968.2666666666668,306.6 L966.6666666666667,311 L965.0666666666667,306.6 L960.6666666666667,305 L965.0666666666667,303.4 Z" fill="#6d28d9"/><text x="950.6666666666667" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Ask the Agent</text><text x="950.6666666666667" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#6d28d9" text-anchor="middle">Aida</text><text x="950.6666666666667" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Tell Aida, in plain English,</text><text x="950.6666666666667" y="408.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">what you want the instrument</text><text x="950.6666666666667" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">to do</text><rect x="60" y="488" width="1060" height="34" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11.6" font-weight="normal" font-style="normal" fill="#64748b" text-anchor="middle">Every plan reachable this way was built to be safe — all three are equally safe to use, in any order or combination.</text><line x1="590.0" y1="522" x2="590.0" y2="562" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-ink)"/><text x="604.0" y="546.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">data collected</text><rect x="60" y="576" width="1060" height="100" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="94" cy="626.0" r="15" fill="none" stroke="#047857" stroke-width="1.8"/><path d="M94,611.0 A15,15 0 0 1 109,626.0" fill="none" stroke="#047857" stroke-width="1.8"/><path d="M109,622.0 l3,4 l-5,1 z" fill="#047857"/><circle cx="94" cy="626.0" r="3.4" fill="#047857"/><circle cx="142" cy="601" r="13" fill="#047857"/><text x="142" y="605.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">3</text><text x="162" y="606" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Data Is Reduced Automatically</text><text x="130" y="628" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Matilda calibrates and reduces every scan the moment it's collected — nothing to click.</text><text x="130" y="646" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Have one tricky file that needs a manual touch? Open matilda-gui.</text><line x1="590.0" y1="676" x2="590.0" y2="716" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-ink)"/><text x="604.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">calibrated data ready</text><circle cx="72" cy="724" r="13" fill="#1e293b"/><text x="72" y="728.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">4</text><text x="92" y="730" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Analyze Your Data</text><rect x="60.0" y="748" width="338.6666666666667" height="190" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><rect x="210.33333333333334" y="768" width="38" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.8"/><path d="M217.33333333333334,777 l7,5 l-7,5" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="230.33333333333334" y1="787" x2="240.33333333333334" y2="787" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><text x="229.33333333333334" y="814" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Command Line</text><text x="229.33333333333334" y="832" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#475569" text-anchor="middle">pyIrena batch scripting</text><text x="229.33333333333334" y="856" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Fit an entire folder at once</text><text x="229.33333333333334" y="872.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">with a saved JSON config —</text><text x="229.33333333333334" y="889.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">great for repeat analyses</text><rect x="420.6666666666667" y="748" width="338.6666666666667" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><rect x="571.0" y="768" width="38" height="26" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><line x1="571.0" y1="775" x2="609.0" y2="775" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="576.0" cy="771.5" r="1.3" fill="#1d4ed8"/><circle cx="581.0" cy="771.5" r="1.3" fill="#1d4ed8"/><path d="M587.0,781 l11,10 l-4.2,0.8 l2.6,5 l-2.6,1.3 l-2.6,-5 l-3.2,3 z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.6" stroke-linejoin="round"/><text x="590.0" y="814" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Desktop App (GUI)</text><text x="590.0" y="832" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#1d4ed8" text-anchor="middle">pyIrena</text><text x="590.0" y="856" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Modeling, Unified Fit, sizing,</text><text x="590.0" y="872.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">peak fits, merging — point</text><text x="590.0" y="889.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">and click, see it fit live</text><rect x="781.3333333333334" y="748" width="338.6666666666667" height="190" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><rect x="931.6666666666667" y="767" width="32" height="22" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/><path d="M941.6666666666667,789 l0,9 l8,-9 z" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/><circle cx="944.6666666666667" cy="778" r="1.6" fill="#6d28d9"/><circle cx="951.6666666666667" cy="778" r="1.6" fill="#6d28d9"/><path d="M966.6666666666667,763 L968.2666666666668,767.4 L972.6666666666667,769 L968.2666666666668,770.6 L966.6666666666667,775 L965.0666666666667,770.6 L960.6666666666667,769 L965.0666666666667,767.4 Z" fill="#6d28d9"/><text x="950.6666666666667" y="814" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="middle">Ask the Agent</text><text x="950.6666666666667" y="832" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#6d28d9" text-anchor="middle">Aida</text><text x="950.6666666666667" y="856" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">Ask Aida to summarize, tabulate,</text><text x="950.6666666666667" y="872.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">or plot what a batch of scans</text><text x="950.6666666666667" y="889.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#334155" text-anchor="middle">found</text><line x1="590.0" y1="952" x2="590.0" y2="992" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-ink)"/><text x="604.0" y="976.0" font-family="Helvetica, Arial, sans-serif" font-size="11.3" font-weight="normal" font-style="italic" fill="#64748b" text-anchor="start">results ready</text><rect x="60" y="1006" width="1060" height="100" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><polyline points="78,1069.0 78,1042.0 111,1042.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><polyline points="80,1062.0 89,1052.0 97,1058.0 109,1045.0" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="142" cy="1031" r="13" fill="#c2410c"/><text x="142" y="1035.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">5</text><text x="162" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Plot for Publication</text><text x="130" y="1058" font-family="Helvetica, Arial, sans-serif" font-size="12.4" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Igor Pro is today's tool for publication-quality figures.</text><text x="1096" y="1092" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" font-style="italic" fill="#c2410c" text-anchor="end">+ Bernardyn — a newer, dedicated plotting app — early alpha, worth watching</text><text x="60" y="1146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1e293b" text-anchor="start">Same three choices, every time:</text><rect x="271" y="1127" width="38" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.8"/><path d="M278,1136 l7,5 l-7,5" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="291" y1="1146" x2="301" y2="1146" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><text x="314" y="1146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Command Line — type it</text><rect x="521" y="1127" width="38" height="26" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><line x1="521" y1="1134" x2="559" y2="1134" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="526" cy="1130.5" r="1.3" fill="#1d4ed8"/><circle cx="531" cy="1130.5" r="1.3" fill="#1d4ed8"/><path d="M537,1140 l11,10 l-4.2,0.8 l2.6,5 l-2.6,1.3 l-2.6,-5 l-3.2,3 z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.6" stroke-linejoin="round"/><text x="564" y="1146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">GUI — click it</text><rect x="771" y="1126" width="32" height="22" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/><path d="M781,1148 l0,9 l8,-9 z" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/><circle cx="784" cy="1137" r="1.6" fill="#6d28d9"/><circle cx="791" cy="1137" r="1.6" fill="#6d28d9"/><path d="M806,1122 L807.6,1126.4 L812,1128 L807.6,1129.6 L806,1134 L804.4,1129.6 L800,1128 L804.4,1126.4 Z" fill="#6d28d9"/><text x="814" y="1146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#334155" text-anchor="start">Agent — ask for it</text></svg>