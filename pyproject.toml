[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. Note this differs from the import package name
# ("aida", see [tool.hatch.build.targets.wheel] below) and from the repo
# name (jilavsky/aida): PyPI auto-blocked first uploads of the bare name
# "aida" as a likely typosquat/name-confusion risk (403, not a real conflict
# — see PLAN.md §2, entry dated 2026-08-18). "aida-workbench" is the
# documented fallback; `pip install aida-workbench[gui]` still gives you
# `import aida` and the `aida` / `aida-gui` console scripts.
name = "aida-workbench"
version = "0.1.0b3"
description = "AIDA — AI Data Assistant: a local scientific agent workbench."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jan Ilavsky", email = "jilavsky@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.28,<2.0",
    "pyyaml>=6.0",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://github.com/jilavsky/aida"
Repository = "https://github.com/jilavsky/aida"
Issues = "https://github.com/jilavsky/aida/issues"

[project.optional-dependencies]
# The exclusions mirror pyirena[gui]'s own PySide6 pin, on purpose. AIDA's
# main audience installs both packages, often into one environment, and pip
# resolving them *sequentially* (`pip install pyirena[gui]` then
# `pip install aida-workbench[gui]`, or the reverse) only ever sees the
# requirement it was asked for: a bare `PySide6>=6.6` here lets pip pick a
# release pyIrena has excluded for a real reason, breaking the *other*
# package with nothing worse than a warning. Matching the exclusions makes
# any resolution order land on a version both accept. AIDA has no stake in
# 6.7.x or 6.10.x specifically, so this costs nothing; if pyIrena ever adds
# or drops an exclusion, mirror it here too.
gui = ["PySide6>=6.6,!=6.7.*,!=6.10.*"]
docs = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
aida = "aida.cli.__main__:main"
aida-gui = "aida.cli.__main__:main_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/aida"]

# The sample skills live at `skills/` in the repo (editable, reviewable,
# referenced by the docs) but must also travel inside the wheel: a
# `pip install aida-workbench` user has no repo to copy from, while
# `workspaces.yaml` examples and the one-click pyIrena MCP setup both
# reference these skills by name. `aida.config.paths.install_bundled_skills`
# copies them into `~/.aida/skills/` on demand, never overwriting.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "aida/resources/skills"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
asyncio_mode = "strict"
