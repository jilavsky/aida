[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aida"
version = "0.0.1"
description = "AIDA — AI Data Assistant: a local scientific agent workbench."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jan Ilavsky", email = "jilavsky@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://github.com/jilavsky/aida"
Repository = "https://github.com/jilavsky/aida"
Issues = "https://github.com/jilavsky/aida/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
docs = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23"]
rag = ["chromadb>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
aida = "aida.cli.__main__:main"
aida-gui = "aida.cli.__main__:main_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/aida"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
