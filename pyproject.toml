[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. Note this differs from the import package name
# ("aida", see [tool.hatch.build.targets.wheel] below) and from the repo
# name (jilavsky/aida): PyPI auto-blocked first uploads of the bare name
# "aida" as a likely typosquat/name-confusion risk (403, not a real conflict
# — see PLAN.md §2, entry dated 2026-08-18). "aida-workbench" is the
# documented fallback; `pip install aida-workbench[gui]` still gives you
# `import aida` and the `aida` / `aida-gui` console scripts.
name = "aida-workbench"
version = "0.0.1"
description = "AIDA — AI Data Assistant: a local scientific agent workbench."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jan Ilavsky", email = "jilavsky@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.28,<2.0",
    "pyyaml>=6.0",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://github.com/jilavsky/aida"
Repository = "https://github.com/jilavsky/aida"
Issues = "https://github.com/jilavsky/aida/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
docs = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23", "Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
aida = "aida.cli.__main__:main"
aida-gui = "aida.cli.__main__:main_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/aida"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
asyncio_mode = "strict"
