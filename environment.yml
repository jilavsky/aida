name: aida
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # The `science` extra, from conda-forge rather than pip: h5py's HDF5
  # library and matplotlib's binary pieces are better served by conda.
  # AIDA does not need them; agent scripts do (see pyproject.toml).
  - numpy>=1.24
  - matplotlib>=3.7
  - h5py>=3.9
  - pip:
      # Matches what CI installs, so the documented conda path exercises
      # the same optional-import branches CI does.
      - -e .[gui,docs,science,dev]
